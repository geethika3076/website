<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Register | MEDinsta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f7f4]">

<div class="min-h-screen flex items-center justify-center px-4">
    <form method="POST" action="/pharmacy-register" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Pharmacy Registration</h2>

        {% if error %}
        <p class="text-red-600 font-bold mb-4 text-center">{{ error }}</p>
        {% endif %}

        <input type="text" name="name" placeholder="Pharmacy Name" required class="border p-2 rounded mb-4 w-full">
        <input type="email" name="email" placeholder="Email" required class="border p-2 rounded mb-4 w-full">
        <input type="password" name="password" placeholder="Password" required class="border p-2 rounded mb-4 w-full">
        <input type="password" name="confirm_password" placeholder="Confirm Password" required class="border p-2 rounded mb-4 w-full">

        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded w-full hover:bg-blue-700 transition">
            Register
        </button>

        <p class="text-center text-sm mt-4">
            Already have an account? 
            <a href="/pharmacy-login" class="text-purple-600 font-bold hover:underline">Login here</a>
        </p>
    </form>
</div>

</body>
</html>
